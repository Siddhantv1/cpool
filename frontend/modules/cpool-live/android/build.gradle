plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cpoollive'
version = '0.1.0'

android {
  namespace "expo.modules.cpoollive"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // React Native's background task API (keeps the app's timers running while the host drives); same as expo-modules-core.
  implementation 'com.facebook.react:react-android'
}
